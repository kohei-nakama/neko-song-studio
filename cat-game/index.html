function updateParticles(dt){for(let i=state.particles.length-1;i>=0;i--){const p=state.particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;if(p.life<=0)state.particles.splice(i,1)}}function spawnFish(kind){const p=free(54);state.fish.push({kind,x:p.x,y:p.y,r:kind==='gold'?20:17,w:rand(0,Math.PI*2),ws:rand(2,4),flip:Math.random()<.5?-1:1})}function spawnHaz(i){const p=free(90),a=rand(0,Math.PI*2),s=modes[mode].speed+rand(-18,28)+i*2;state.haz.push({x:p.x,y:p.y,r:rand(21,28),vx:Math.cos(a)*s,vy:Math.sin(a)*s,spin:rand(0,Math.PI*2),ss:rand(-3,3),shade:Math.random()<.5?'#5fb06b':'#57a7c7'})}function free(m){for(let i=0;i<50;i++){const p={x:rand(m,W-m),y:rand(m,H-m)};if(dist(p,state.cat||{x:W/2,y:H/2})>160)return p}return{x:rand(m,W-m),y:rand(m,H-m)}}function burst(x,y,color,n){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),s=rand(60,190),life=rand(.32,.76);state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,color,size:rand(3,8)})}}
function draw(){ctx.save();ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);room();state.fish.forEach(drawFish);if(state.yarn)drawYarn(state.yarn);if(state.item)drawItem(state.item);state.haz.forEach(drawHaz);drawParticles();drawCat(state.cat);drawFloaters();if(state.phase==='paused'){ctx.globalAlpha=.18;ctx.fillStyle='#202532';ctx.fillRect(0,0,W,H)}ctx.restore()}function room(){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#cce9bf');g.addColorStop(.5,'#a5ddc6');g.addColorStop(1,'#f3d4a5');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.17;ctx.strokeStyle='#fff';ctx.lineWidth=2;for(let x=-120;x<W+120;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+210,H);ctx.stroke()}for(let y=60;y<H;y+=86){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y-68);ctx.stroke()}ctx.restore();ctx.save();ctx.globalAlpha=.16;ctx.fillStyle='#69527b';round(290,235,420,192,36);ctx.fill();ctx.restore()}
function drawFish(f){ctx.save();ctx.translate(f.x,f.y);ctx.scale(f.flip,1);ctx.rotate(Math.sin(f.w)*.12);ctx.fillStyle=f.kind==='gold'?'#f36f64':'#74d4bf';ctx.beginPath();ctx.moveTo(-f.r*.72,0);ctx.lineTo(-f.r*1.35,-f.r*.6);ctx.lineTo(-f.r*1.28,f.r*.62);ctx.closePath();ctx.fill();ctx.fillStyle=f.kind==='gold'?'#f4bd4f':'#4d7fd1';ctx.beginPath();ctx.ellipse(0,0,f.r*1.05,f.r*.65,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fffaf0';ctx.beginPath();ctx.arc(f.r*.45,-f.r*.16,f.r*.16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#202532';ctx.beginPath();ctx.arc(f.r*.49,-f.r*.16,f.r*.07,0,Math.PI*2);ctx.fill();ctx.restore()}function drawHaz(h){ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.spin);ctx.fillStyle='rgba(32,37,50,.13)';ctx.beginPath();ctx.ellipse(0,h.r+17,h.r*1.1,h.r*.36,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=h.shade==='#57a7c7'?'#57a7c7':'#5fb06b';h.shade==='#57a7c7'?(ctx.beginPath(),ctx.ellipse(0,0,h.r*1.14,h.r*.78,.3,0,Math.PI*2),ctx.fill()):(round(-h.r*1.15,-h.r*.48,h.r*2.3,h.r*.96,h.r*.46),ctx.fill());ctx.restore()}function drawYarn(y){ctx.save();ctx.translate(y.x,y.y);ctx.rotate(y.spin);ctx.fillStyle='#74d4bf';ctx.beginPath();ctx.arc(0,0,y.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(32,37,50,.27)';ctx.lineWidth=3;for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(0,0,y.r-4,5+i*2,i*Math.PI/4,0,Math.PI*2);ctx.stroke()}ctx.restore()}function drawItem(it){ctx.save();ctx.translate(it.x,it.y+Math.sin(it.w)*4);ctx.shadowColor='rgba(32,37,50,.28)';ctx.shadowBlur=10;ctx.lineJoin='round';ctx.lineCap='round';if(it.kind==='heart'){ctx.fillStyle='#f36f64';ctx.beginPath();ctx.moveTo(0,19);ctx.bezierCurveTo(-31,0,-17,-26,0,-12);ctx.bezierCurveTo(17,-26,31,0,0,19);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fffaf0';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-10,2);ctx.lineTo(10,2);ctx.moveTo(0,-8);ctx.lineTo(0,12);ctx.stroke()}else if(it.kind==='clock'){ctx.fillStyle='#fffaf0';ctx.strokeStyle='#57a7c7';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#202532';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-11);ctx.moveTo(0,0);ctx.lineTo(10,6);ctx.stroke()}else if(it.kind==='evolve'){ctx.fillStyle='#a855f7';ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?12:29;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#f4bd4f';ctx.beginPath();ctx.moveTo(-16,8);ctx.lineTo(-9,-11);ctx.lineTo(0,1);ctx.lineTo(9,-11);ctx.lineTo(16,8);ctx.closePath();ctx.fill();ctx.strokeStyle='#fffaf0';ctx.lineWidth=3;ctx.stroke()}else{ctx.fillStyle='#f4bd4f';round(-21,-14,42,28,14);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fffaf0';ctx.beginPath();ctx.arc(-8,-3,4,0,Math.PI*2);ctx.arc(8,4,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#202532';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-16,8);ctx.lineTo(16,-8);ctx.stroke()}ctx.restore()}
function drawCat(c,target=ctx){if(!c)return;const ctx=target,palette=catSkins.find(s=>s.id===(c.skin||profile.selected))||catSkins[0];ctx.save();ctx.translate(c.x,c.y);const evo=c.evolve>0,dir=Math.abs(c.vx)>8?Math.sign(c.vx):1;ctx.scale(dir*(evo?1.12:1),evo?1.12:1);if(c.inv>0&&Math.floor(c.inv*14)%2===0)ctx.globalAlpha=.55;if(evo){const a=ctx.globalAlpha;ctx.globalAlpha=.28;ctx.fillStyle='#f4bd4f';ctx.beginPath();ctx.arc(5,3,68+Math.sin(performance.now()/95)*5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=a}ctx.fillStyle='rgba(32,37,50,.15)';ctx.beginPath();ctx.ellipse(0,38,43,13,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=palette.ear;ctx.lineWidth=16;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-34,2);ctx.bezierCurveTo(-66,-24,-72,28,-48,24);ctx.stroke();ctx.fillStyle=palette.body;ctx.beginPath();ctx.ellipse(0,10,41,31,.08,0,Math.PI*2);ctx.arc(20,-16,30,0,Math.PI*2);ctx.fill();ctx.fillStyle=palette.ear;ctx.beginPath();ctx.moveTo(4,-38);ctx.lineTo(14,-69);ctx.lineTo(28,-37);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(34,-35);ctx.lineTo(54,-60);ctx.lineTo(55,-25);ctx.closePath();ctx.fill();if(evo){ctx.fillStyle='#f4bd4f';ctx.strokeStyle=palette.ink;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(7,-51);ctx.lineTo(15,-72);ctx.lineTo(26,-54);ctx.lineTo(38,-70);ctx.lineTo(40,-47);ctx.closePath();ctx.fill();ctx.stroke()}ctx.fillStyle=palette.patch;ctx.beginPath();ctx.ellipse(-12,4,14,22,-.85,0,Math.PI*2);ctx.ellipse(10,-24,11,16,-.45,0,Math.PI*2);ctx.fill();ctx.fillStyle=palette.ink;ctx.beginPath();ctx.arc(14,-18,3.3,0,Math.PI*2);ctx.arc(36,-17,3.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f36f64';ctx.beginPath();ctx.moveTo(25,-10);ctx.lineTo(30,-8);ctx.lineTo(25,-5);ctx.closePath();ctx.fill();ctx.strokeStyle=palette.ink;ctx.lineWidth=1.8;ctx.lineCap='round';for(const side of[-1,1]){ctx.beginPath();ctx.moveTo(25,-6);ctx.quadraticCurveTo(36,-5+side*5,49,-9+side*7);ctx.stroke()}const paw=Math.sin(c.step)*4;ctx.fillStyle=palette.body;ctx.beginPath();ctx.ellipse(-18,34+paw,10,8,0,0,Math.PI*2);ctx.ellipse(20,34-paw,10,8,0,0,Math.PI*2);ctx.fill();if(c.power>0){ctx.globalAlpha=.65;ctx.strokeStyle=evo?'#a855f7':'#74d4bf';ctx.lineWidth=5;ctx.beginPath();ctx.arc(5,4,(evo?66:55)+Math.sin(performance.now()/90)*4,0,Math.PI*2);ctx.stroke()}ctx.restore()}function drawParticles(){for(const p of state.particles){const a=Math.max(0,p.life/p.max);ctx.save();ctx.globalAlpha=a;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*a,0,Math.PI*2);ctx.fill();ctx.restore()}}
function hud(){
  score.textContent=state.score;best.textContent=state.best;time.textContent=Math.ceil(state.time);time.classList.toggle('time-low',state.time<=10&&state.phase==='playing');
  combo.textContent='x'+state.combo;level.textContent=state.level;life.setAttribute('aria-label','ライフ '+state.lives);
  [...life.children].forEach((h,i)=>h.classList.toggle('off',i>=state.lives));
  const evo=state.cat?.evolve||0,boost=state.cat?.power||0;
  powerBar.style.width=Math.min(100,Math.round(Math.max(evo,boost)/8*100))+'%';
  $('powerLabel').textContent=evo>0?'進化中・得点2倍':boost>0?'スピードUP':'おやつタイム';
  $('powerTime').textContent=Math.max(evo,boost)>0?Math.ceil(Math.max(evo,boost))+'秒':'';
  const target=state.run?.target||50;
  goalText.textContent=state.score>=target?'目標クリア！ 次は'+nextGoal(state.score)+'点':target+'点まで あと'+(target-state.score)+'点';
  goalProgress.max=target;goalProgress.value=Math.min(state.score,target);
}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function rand(a,b){return Math.random()*(b-a)+a}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function round(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function readBest(){try{return Math.max(Number(localStorage.getItem(KB)||0),readScores()[0]||0)}catch{return 0}}function writeBest(v){try{localStorage.setItem(KB,String(v))}catch{}}function readScores(){try{const s=JSON.parse(localStorage.getItem(KS)||'[]');return Array.isArray(s)?s.map(Number).filter(n=>Number.isFinite(n)&&n>=0).sort((a,b)=>b-a).slice(0,5):[]}catch{return[]}}function saveScore(s){const scores=readScores();scores.push(Number(s)||0);const top=scores.sort((a,b)=>b-a).slice(0,5);try{localStorage.setItem(KS,JSON.stringify(top))}catch{}return top}function renderScores(scores){history.textContent='';scores.forEach((s,i)=>{const li=document.createElement('li'),rank=document.createElement('span'),val=document.createElement('strong');rank.textContent=i+1;val.textContent=s;li.append(rank,val);history.append(li)});history.hidden=!scores.length}
function getRecommendation(s){return songRecommendations.find(r=>s>=r.min&&s<=r.max)||songRecommendations[songRecommendations.length-1]}function withUtm(url){const u=new URL(url,location.href);UTM.split('&').forEach(pair=>{const [k,v]=pair.split('=');u.searchParams.set(k,v)});return u.href}function renderRecommendation(r){catType.textContent=`あなたは「${r.catType}」！`;songPick.textContent=`おすすめ曲：${r.songTitle}`;resultBox.hidden=false}function updateResultLinks(r){youtubeLink.href=withUtm(r.url);subscribeLink.href=withUtm(YOUTUBE_CHANNEL)}
function disableShare(){share.href='#';share.classList.add('off');share.setAttribute('aria-disabled','true');share.setAttribute('tabindex','-1')}function updateShareLink(){const u=new URL(location.href);u.search='';u.hash='';const text=`ねこスナックランで${state.score}点とったにゃ！\nあなたは超えられる？🐾\n\n#猫ソングスタジオ #ねこスナックラン #猫ゲーム`;share.href=`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(u.href)}`;share.classList.remove('off');share.setAttribute('aria-disabled','false');share.removeAttribute('tabindex')}
function beep(f,d,t,gain){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=gain;g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{muted=true;sound.style.opacity='.45'}}
function dayKey(date=new Date()){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}
function count(value){return typeof value==='number'&&Number.isFinite(value)&&value>=0?Math.min(Math.floor(value),1e9):0}
function blankDaily(){return{date:dayKey(),plays:0,fish:0,best:0,claimed:[]}}
function readProgress(){
  let saved={};try{saved=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'{}')||{}}catch{}
  const unlocked=['mike',...catSkins.slice(1).filter(s=>Array.isArray(saved.unlocked)&&saved.unlocked.includes(s.id)).map(s=>s.id)];
  const daily=blankDaily();
  if(saved.daily?.date===daily.date){daily.plays=count(saved.daily.plays);daily.fish=count(saved.daily.fish);daily.best=count(saved.daily.best);daily.claimed=Array.isArray(saved.daily.claimed)?saved.daily.claimed.filter(id=>['play','fish','score'].includes(id)):[]}
  return{version:1,mode:modes[saved.mode]?saved.mode:'easy',muted:saved.muted===true,selected:unlocked.includes(saved.selected)?saved.selected:'mike',unlocked,plays:count(saved.plays),records:{easy:count(saved.records?.easy),normal:count(saved.records?.normal),hard:count(saved.records?.hard)},daily};
}
function saveProgress(){try{localStorage.setItem(PROGRESS_KEY,JSON.stringify(profile));storageAvailable=true}catch{storageAvailable=false}
  $('storageNote').textContent=storageAvailable?'記録と猫は、このブラウザに保存されます。':'このブラウザでは保存できません。記録はページを閉じるまで有効です。';
}
function ensureToday(){if(profile.daily.date!==dayKey()){profile.daily=blankDaily();saveProgress()}}
function dailyGoals(){
  const seed=Number(profile.daily.date.replaceAll('-',''))%3;
  return[{id:'play',label:'1回さいごまで遊ぶ',target:1,value:profile.daily.plays},
    {id:'fish',label:'お魚を'+(12+seed*4)+'匹集める',target:12+seed*4,value:profile.daily.fish},
    {id:'score',label:'1回で'+(100+seed*25)+'点をとる',target:100+seed*25,value:profile.daily.best}];
}
function nextGoal(score){return [50,100,150,200,300,500,750,1000].find(n=>n>score)||Math.floor(score/250)*250+250}
function finishProgress(){
  const previously=new Set(profile.unlocked);ensureToday();
  profile.plays++;profile.records[mode]=Math.max(profile.records[mode],state.score);
  // Credit a run to its start date only, so a midnight rollover cannot reuse yesterday's progress.
  if(profile.daily.date===state.run.day){profile.daily.plays++;profile.daily.fish+=state.run.fish;profile.daily.best=Math.max(profile.daily.best,state.score);
    for(const goal of dailyGoals()){if(goal.value>=goal.target&&!profile.daily.claimed.includes(goal.id)){profile.daily.claimed.push(goal.id);trackEvent('cat_game_mission_complete',{mode,mission:goal.id,score:state.score})}}
  }
  if(profile.plays>=1&&!profile.unlocked.includes('snow'))profile.unlocked.push('snow');
  if(Math.max(...Object.values(profile.records))>=150&&!profile.unlocked.includes('night'))profile.unlocked.push('night');
  if(dailyGoals().every(g=>g.value>=g.target)&&!profile.unlocked.includes('mint'))profile.unlocked.push('mint');
  const unlocked=profile.unlocked.filter(id=>!previously.has(id));
  unlocked.forEach(id=>trackEvent('cat_game_cat_unlock',{mode,cat:id,score:state.score}));saveProgress();return unlocked;
}
function renderCollection(){
  ensureToday();const goals=dailyGoals(),missions=$('missions');missions.replaceChildren();
  goals.forEach(g=>{const li=document.createElement('li'),name=document.createElement('strong'),amount=document.createElement('small'),bar=document.createElement('progress'),done=g.value>=g.target;
    li.className='mission'+(done?' done':'');name.textContent=g.label;amount.textContent=done?'クリア！':Math.min(g.value,g.target)+' / '+g.target;
    bar.max=g.target;bar.value=Math.min(g.value,g.target);bar.setAttribute('aria-label',g.label);li.append(name,amount,bar);missions.append(li)});
  $('dailyCount').textContent=goals.filter(g=>g.value>=g.target).length+' / 3 クリア';
  $('skinCount').textContent=profile.unlocked.length+' / '+catSkins.length;const skins=$('skins');skins.replaceChildren();
  catSkins.forEach(s=>{
    const unlocked=profile.unlocked.includes(s.id),chosen=profile.selected===s.id,button=document.createElement('button'),preview=document.createElement('canvas'),name=document.createElement('strong'),hint=document.createElement('small');
    button.type='button';button.className='skin';button.disabled=!unlocked;button.dataset.skin=s.id;button.setAttribute('aria-pressed',String(chosen));button.setAttribute('aria-label',s.name+'：'+(unlocked?(chosen?'選択中':'選ぶ'):s.hint+'で仲間になる'));
    preview.width=156;preview.height=116;preview.setAttribute('aria-hidden','true');name.textContent=s.name;hint.textContent=chosen?'いっしょに遊ぶ':unlocked?'選ぶ':s.hint;
    button.append(preview,name,hint);skins.append(button);paintPreview(preview,s.id);
    button.onclick=()=>{if(state.phase!=='ready'&&state.phase!=='ended')return;profile.selected=s.id;saveProgress();trackEvent('cat_game_cat_select',{cat:s.id});if(state.phase==='ready')state.cat.skin=s.id;renderCollection();drawPreview();draw();$('skins').querySelector('[data-skin='+s.id+']').focus({preventScroll:true})};
  });
}
function paintPreview(canvas,skin){
  const context=canvas.getContext('2d');context.clearRect(0,0,canvas.width,canvas.height);context.save();context.scale(canvas.width/156,canvas.height/116);
  drawCat({x:75,y:73,vx:0,step:0,inv:0,power:0,evolve:0,skin},context);context.restore();
}
function drawPreview(){paintPreview(catPreview,profile.selected)}
function floatText(x,y,text,color){state.floaters.push({x,y,text,color,life:1.1});if(state.floaters.length>6)state.floaters.shift()}
function updateFloaters(dt){state.floaters=state.floaters.filter(f=>{f.life-=dt;f.y-=30*dt;return f.life>0})}
function drawFloaters(){for(const f of state.floaters||[]){ctx.save();ctx.globalAlpha=Math.min(1,f.life*3);ctx.font='bold 25px system-ui';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#fff';const half=ctx.measureText(f.text).width/2,x=clamp(f.x,half+8,W-half-8);ctx.strokeText(f.text,x,Math.max(32,f.y-25));ctx.fillStyle=f.color;ctx.fillText(f.text,x,Math.max(32,f.y-25));ctx.restore()}}
addEventListener('beforeunload',()=>cancelAnimationFrame(raf));
})();
